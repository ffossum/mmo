[package]
name = "mmo-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bevy = { version = "0.18", default-features = false, features = ["std", "bevy_log"] }
bevy_rapier3d = { version = "0.33", default-features = false, features = [
    "dim3",
    "simd-stable",
    "parallel",
] }
enet = "0.3"
gltf = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
